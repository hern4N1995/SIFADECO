services:
  db:
    image: postgres:16-alpine
    container_name: sifadeco_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-sifadecodb}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-sifadecodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sifadeco_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sifadeco_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      PGHOST: db
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-sifadecodb}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - sifadeco_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sifadeco_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - sifadeco_net

networks:
  sifadeco_net:
    driver: bridge

volumes:
  db_data:
    name: sifadeco_db_data
